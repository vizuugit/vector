  <rect x="200" y="400" width="900" height="6" fill="#2BCAD0" opacity="0.95"/>
  <text class="by" x="510" y="500">by</text>
  <text class="vzu" x="550" y="503">VZU</text>
  <text class="studio" x="664" y="503">STUDIO</text>
