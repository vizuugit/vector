<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .vec     { fill: #2BCAD0; font-family: 'Ubuntu Sans','Ubuntu','DejaVu Sans',sans-serif; font-size: 140px; font-weight: 800; letter-spacing: 5px; }
      .rp      { fill: #D2F8FF; font-family: 'Ubuntu Sans','Ubuntu','DejaVu Sans',sans-serif; font-size: 140px; font-weight: 800; letter-spacing: 5px; }
      .tag     { fill: #8A98A2; font-family: 'Ubuntu Sans','Ubuntu','DejaVu Sans',sans-serif; font-size: 26px; font-weight: 500; letter-spacing: 6px; }
      .by      { fill: #8A98A2; font-family: 'Ubuntu Sans','Ubuntu','DejaVu Sans',sans-serif; font-size: 22px; font-weight: 500; letter-spacing: 3px; }
      .vzu     { fill: #2BCAD0; font-family: 'Ubuntu Sans','Ubuntu','DejaVu Sans',sans-serif; font-size: 32px; font-weight: 800; letter-spacing: 5px; }
      .studio  { fill: #D2F8FF; font-family: 'Ubuntu Sans','Ubuntu','DejaVu Sans',sans-serif; font-size: 32px; font-weight: 600; letter-spacing: 3px; }
    </style>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1F26"/>
      <stop offset="100%" stop-color="#0F1318"/>
    </linearGradient>
