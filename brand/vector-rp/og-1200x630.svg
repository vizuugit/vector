  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect x="60" y="60" width="1080" height="3" fill="#2BCAD0" opacity="0.4"/>
  <rect x="60" y="567" width="1080" height="3" fill="#2BCAD0" opacity="0.4"/>
