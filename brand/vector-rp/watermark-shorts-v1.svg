<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <style>
      .vec { fill: #2BCAD0; font-family: 'Ubuntu Sans','Ubuntu','DejaVu Sans',sans-serif; font-size: 56px; font-weight: 800; letter-spacing: 1.5px; }
      .rp  { fill: #D2F8FF; font-family: 'Ubuntu Sans','Ubuntu','DejaVu Sans',sans-serif; font-size: 56px; font-weight: 800; letter-spacing: 1.5px; }
    </style>
  </defs>
  <!-- Top-left safe area (CMO spec: clears TikTok For You search icon at top-right and front-loads watermark in viewer eye-flow). Chip 420x96 starts at x=72 (72px left margin), y=246 (below status bar + tabs). -->
  <g opacity="0.8" transform="translate(72 246)">
    <rect x="0" y="0" width="420" height="96" rx="12" fill="#0F1318" opacity="0.78"/>
    <text class="vec" x="22" y="64">VECTOR</text>
    <circle cx="262" cy="46" r="4.5" fill="#2BCAD0"/>
    <text class="rp"  x="284" y="64">RP</text>
    <rect x="22" y="76" width="376" height="3" fill="#2BCAD0" opacity="0.95"/>
  </g>
</svg>
