# VZU dev server — txAdmin deployer recipe
#
# This file lets a fresh box reproduce the inherited
# `Qbox_F913B4.base` deployment via txAdmin's "Deployer" flow.
#
# Source: upstream Qbox recipe, vendored as a starting point and
# overlaid with VZU-specific load_resource lines.
#
# Upstream:    https://github.com/Qbox-project/recipe
# Pinned at:   commit F913B4 (matches the inherited recipe folder name)
# License:     GPL-3.0
#
# How to use (fresh box):
#
#   1. Install Docker + docker-compose-plugin.
#   2. Bring up the stack with the sibling docker-compose.yml + .env
#      (FXServer + MariaDB + Adminer).
#   3. Visit http://localhost:40120 → "Setup new server" → "Deploy".
#   4. Paste the URL of THIS file (or its raw content) when prompted.
#   5. txAdmin clones, applies replacers, runs migrations, drops
#      ${VARS} from .env into the rendered server.cfg.
#
# After deploy, the runtime config lives at:
#
#   txData/<recipe-name>/server.cfg   ← rendered from server.cfg.template
#   txData/<recipe-name>/resources/   ← cloned per `download_*` tasks
#
# The deployed `server.cfg` is regenerated each deploy. Source-of-truth
# is `server/server.cfg.template` in this repo — edit there, redeploy
# the recipe, never hand-edit the rendered file.

$engine: 5
$onesync: on
$minFxVersion: 12000

name: vzu-dev-local
version: 0.1.0
author: VZU Studio
description: Vector Zen Underground dev server (Qbox-based, dev-only)

# Variables prompted at deploy time (or pulled from .env). Match
# server.cfg.template — keep these names in sync.
variables:
  - name: dbHost
    label: MariaDB host
    default: mariadb
  - name: dbName
    label: MariaDB database
    default: vzu_dev
  - name: dbUser
    label: MariaDB user
    default: vzu
  - name: dbPassword
    label: MariaDB password
    type: password
  - name: licenseKey
    label: Cfx.re license key
    type: password

# ─────────────────────────────────────────────────────────────
# Tasks — txAdmin runs these in order during deploy. The full
# upstream task list is preserved in the inherited recipe at
# txData/Qbox_F913B4.base/. When we do a fresh deploy we resync
# this list against upstream and pin commits per resource.
#
# This file currently captures the SHAPE; the per-resource task
# list will be ported over as part of the monorepo cutover (see
# docs/runbooks/local-dev-server.md → Migration path).
# ─────────────────────────────────────────────────────────────

tasks: []
  # ─────────────────────────────────────────────────────────────────────
  # NOT A RUNNABLE RECIPE YET — this file documents the SHAPE of a
  # future fresh-deploy recipe. txAdmin will reject the recipe metadata
  # above with an empty `tasks` list, which is intentional: do not point
  # txAdmin's "Deploy" flow at this file. Use the upstream Qbox recipe
  # directly until monorepo cutover.
  #
  # Why empty: a runnable recipe needs the full per-resource task list
  # (~70 entries for qbox + ox + standalone + voice + assets + npwd, plus
  # post-deploy `move_path` + `replace_string` entries that bind .env
  # secrets into server.cfg). We have not yet pinned upstream commits per
  # resource for our own redistribution, and shipping a half-runnable
  # recipe (with `query_database` against files no `download_github` ever
  # placed, or with a `write_file` of a non-functional server.cfg stub)
  # would silently break fresh deploys for whoever runs it first.
  #
  # The full task list lands here as part of the monorepo cutover, when
  # each vendored resource gets a `resources/[vendor]/<name>/` folder
  # with its own `VENDORED.md` (upstream URL, commit pin, license).
  #
  # Reference shape for the cutover (do NOT uncomment until each
  # download_github entry is real):
  #
  #   # 1. Pull each vendored resource at its pinned commit
  #   - action: download_github
  #     src: https://github.com/Qbox-project/qbx_core
  #     ref: <pinned-commit>
  #     dest: ./resources/[qbx]/qbx_core
  #   - action: download_github
  #     src: https://github.com/overextended/ox_lib
  #     ref: <pinned-commit>
  #     dest: ./resources/[ox]/ox_lib
  #   # …~70 more download_github entries, one per [ox]/[qbx]/[standalone]/
  #   # [voice]/[assets]/[npwd]/[npwd-apps] resource per the inventory in
  #   # docs/runbooks/circuit-hack-inventory.md
  #
  #   # 2. Pull our [vector]/ resources from the monorepo
  #   - action: download_github
  #     src: https://github.com/<org>/vector
  #     ref: main
  #     subpath: resources/[vector]
  #     dest: ./resources/[vector]
  #
  #   # 3. Render server.cfg from the template, substituting ${VAR} from
  #   # the deployer-prompt + .env values
  #   - action: write_file
  #     file: ./server.cfg
  #     data: <full server/server.cfg.template content with substitutions>
  #
  #   # 4. Bootstrap oxmysql schema (oxmysql ships an install.sql; this
  #   # task can only run AFTER step 1 has placed the file on disk)
  #   - action: query_database
  #     file: ./resources/[ox]/oxmysql/scripts/sql/install.sql
  #
  # See:
  #   - docs/runbooks/local-dev-server.md       §Migration path
  #   - docs/runbooks/circuit-hack-inventory.md  for the keep-fork-scrub list
  #   - docs/server/migrations.md                for the ongoing-schema flow
  #     (per-resource SQL goes through `db/migrations/`, not the recipe)
  # ─────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────
# Notes for the operator:
#
# - Secrets never live in this file. All `${VAR}` references resolve
#   from the .env loaded by docker-compose, NOT from txAdmin variables.
#   txAdmin variables here are only for prompts when a human is
#   driving the deployer UI.
#
# - The inherited recipe folder `Qbox_F913B4.base/` is the deployed
#   artifact. Treat it as a build output — re-running the deployer
#   regenerates it.
#
# - First-time admin: txAdmin asks for an admin master account on
#   first boot. The account lives in `txData/admins.json` (bcrypt
#   hashed) and is **never** committed.
#
# - vzu_circuit_hack_test_zone (smoke rig) MUST NOT be deployed by
#   this recipe. It hands out free money and admin shortcuts and is
#   dev-only. Lives under tools/dev-bench/ post-cutover.
# ─────────────────────────────────────────────────────────────────────
