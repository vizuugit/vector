<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vector-palette · test card</title>
    <link rel="stylesheet" href="../../vector-palette/palette.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        font-family: "Inter", system-ui, sans-serif;
        color: var(--vec-hud-text);
      }
      #card {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        background: var(--vec-hud-plate-rgba);
      }
      #card.visible {
        display: flex;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(180px, 1fr));
        gap: 16px;
        padding: 24px;
        background: var(--vec-world-soft-black);
        border: 1px solid var(--vec-world-asphalt);
        border-radius: 8px;
      }
      .swatch {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 12px;
        border-radius: 4px;
        background: var(--vec-world-asphalt);
      }
      .chip {
        height: 60px;
        border-radius: 4px;
        border: 1px solid var(--vec-world-concrete);
      }
      .name {
        font-size: 13px;
        font-weight: 600;
      }
      .hex,
      .alpha {
        font-size: 11px;
        font-family: ui-monospace, monospace;
        color: var(--vec-world-bone);
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div class="grid" id="grid"></div>
    </div>
    <script src="test-card.js"></script>
  </body>
</html>
